name: Android APK and Release

on:
  push:
    branches: [Auralis, main]
    tags: ['v*']
  pull_request:
    branches: [Auralis, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests, lint, and build APK
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Auralis TV ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
